# =============================================================================
# Platform — 建構並推送 Docker Image 到 Docker Hub
# =============================================================================
#
# 【設計理念】
#   這個 workflow 負責「產出完整平台的可部署 Image」：
#   先建構前端 SPA 產物，嵌入 backend 的 static 目錄，
#   再用 Spring Boot Buildpacks 打包成一個包含前後端的 Docker Image。
#   最終產出：docker.io/{user}/documentation-platform:{version}
#
# 【為什麼前後端包在同一個 Image？】
#   backend 使用 Spring Boot 內嵌靜態檔案的方式 serve 前端 SPA，
#   所以這個 Image = 後端 API + 前端靜態檔案，是一個完整的可部署單元。
#
# 【觸發時機】
#   - tag push（格式：1.0.0）：正式發版，推 tag 即建構
#   - workflow_dispatch：手動觸發，可指定任意版本號
#
# 【Job 流程圖】
#
#   frontend-build ──→ build-and-push
#   (npm build)        (下載前端產物 → bootBuildImage → push to Docker Hub)
#
# =============================================================================

name: Platform - Build and Push Docker Image

on:
  push:
    # 【Tag 格式說明】
    # 符合 semver 格式：1.0.0、1.0.0-rc.1、2.1.3 等
    # 不需要 v 前綴（但 Compute version 步驟有容錯處理，v1.0.0 也能正確解析為 1.0.0）
    # 同一個 tag 會同時觸發本 workflow（platform）和 mcpserver-image.yml
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g., 1.0.0)'
        required: true
        default: 'latest'

# 【最小權限原則】只需讀取 repo 內容
permissions:
  contents: read

# 【concurrency 說明】
# group 用固定名稱（非 github.ref），因為建構 image 是冪等操作，
# 同時間不應該有兩個 platform image 在建構。
# cancel-in-progress: false → 已開始的建構不應被取消，避免浪費已用的運算資源。
concurrency:
  group: platform-image
  cancel-in-progress: false

env:
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
  IMAGE_NAME: documentation-platform
  JAVA_VERSION: '25'
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # frontend-build：建構前端產物
  # ===========================================================================
  # 產出的 dist/ 透過 artifact 傳給下游 job，
  # 這樣前端和後端可以在不同 runner 上執行（GitHub Actions job 之間無法共享檔案系統）。
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # 上傳前端建構產物，供 build-and-push job 下載
      # retention-days: 1 → 只需短暫保留，下游 job 取完即可丟棄
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ===========================================================================
  # build-and-push：打包 Docker Image 並推送
  # ===========================================================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # 【版本號計算邏輯】
      # - workflow_dispatch：直接使用使用者輸入的 version
      # - tag push：取 tag 名稱，自動去掉可能的 v 前綴（v1.0.0 → 1.0.0）
      # ${VERSION#v} 是 bash parameter expansion，移除開頭的 v 字元
      - name: Compute version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            VERSION="${{ github.ref_name }}"
            echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
          fi

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # 下載前端產物，直接放入 backend 的 static 目錄
      # Spring Boot 啟動時會自動 serve 這些靜態檔案
      - name: Download frontend artifacts
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: backend/src/main/resources/static/

      - name: Verify frontend files
        run: |
          echo "Frontend files in static directory:"
          ls -la backend/src/main/resources/static/

      # 【固定 Docker 版本】
      # GitHub Actions runner 於 2026-02-09 升級至 Docker 29.1，
      # Docker 29+ 預設啟用 containerd image store，與 Cloud Native Buildpacks
      # 的 lifecycle 不相容（creator 階段 "No such image" / "image has no layers"）。
      # 固定使用 Docker 28 直到 Buildpacks lifecycle 完整支援 containerd。
      # 追蹤：https://github.com/buildpacks/pack/issues/2270
      - name: Setup Docker 28
        uses: docker/setup-docker-action@v4
        with:
          version: v28.1.1

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 【Spring Boot Buildpacks】
      # bootBuildImage 使用 Cloud Native Buildpacks 建構 OCI Image，
      # 不需要自己寫 Dockerfile，自動偵測 JDK 版本、設定記憶體、分層快取。
      # --publishImage 直接推送到 registry，不需要額外 docker push。
      - name: Build and Push Docker Image
        working-directory: backend
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          ./gradlew bootBuildImage \
            --imageName=docker.io/${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            --publishImage

      # 【Job Summary】
      # 寫入 $GITHUB_STEP_SUMMARY，在 GitHub Actions 的 Summary 頁面顯示結果。
      - name: Output image info
        run: |
          echo "### Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`docker.io/${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Java | ${{ env.JAVA_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Tool | Spring Boot Buildpacks |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull docker.io/${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
